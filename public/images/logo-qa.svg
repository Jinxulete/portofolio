<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 86" role="img" aria-labelledby="title description">
  <title id="title">QriAna.dev</title>
  <desc id="description">Oriana wordmark with the O transformed into a Q and the first A highlighted to represent Quality Assurance</desc>

  <!-- The complete ring still reads as the original O. -->
  <circle cx="40" cy="42" r="28" fill="none" stroke="#5F74D2" stroke-width="4"/>

  <!-- A small paper-coloured break makes the added Q tail visibly separate. -->
  <path d="M55 57l15 15" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <path d="M56 58l14 14" fill="none" stroke="#D99120" stroke-width="4" stroke-linecap="round"/>

  <text x="70" y="55" fill="#1F2937" font-family="Roboto, Arial, sans-serif" font-size="37" font-weight="700" letter-spacing="-1">ri</text>

  <!-- The A mirrors the Q at the same visual height. Its gold bar echoes the added Q tail. -->
  <path d="M88 70l22-56 22 56" fill="none" stroke="#5F74D2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M92 47h36" fill="none" stroke="#D99120" stroke-width="4" stroke-linecap="round"/>

  <text x="131" y="55" font-family="Roboto, Arial, sans-serif" font-size="37" font-weight="700" letter-spacing="-1">
    <tspan fill="#1F2937">na</tspan><tspan fill="#64748B" font-size="29" font-weight="600">.dev</tspan>
  </text>
</svg>
